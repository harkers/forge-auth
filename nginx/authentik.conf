# Authentik SSO - Nginx Configuration
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name auth.titan.lan;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 192.168.10.80:443 ssl http2;
    server_name auth.titan.lan;

    # SSL certificates (adjust path as needed)
    ssl_certificate /etc/nginx/ssl/openclaw.crt;
    ssl_certificate_key /etc/nginx/ssl/openclaw.key;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Required headers for Authentik
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    # WebSocket support (REQUIRED for Authentik outposts)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts for long-lived connections
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    # Main Authentik server (HTTPS port)
    location / {
        proxy_pass https://127.0.0.1:9443;
    }

    # Health endpoint (HTTP port, no auth needed)
    location /-/health/ {
        proxy_pass http://127.0.0.1:9000;
    }
}